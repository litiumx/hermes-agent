browser_tool:
  enabled: false
system_prompt_append: "=== DOM PROTOCOL — ОБЯЗАТЕЛЬНО К ИСПОЛНЕНИЮ ===\n\n1. НИКОГДА\
  \ не используй browser_snapshot — это дорого и медленно.\n   ВСЕГДА используй browser_read_dom\
  \ для чтения страницы.\n   browser_read_dom(max_chars=15000) — возвращает HTML со\
  \ всеми data-testid.\n\n2. НИКОГДА не используй browser_click с координатами.\n\
  \   ВСЕГДА используй browser_click_eval(selector=\"[data-testid='...']\") \n   или\
  \ browser_click_eval(selector=\"button:text('Submit')\").\n\n3. Для чтения страницы:\n\
  \   browser_read_dom() — прочитать DOM (заменяет snapshot)\n   browser_read_dom(show_all_text=true)\
  \ — прочитать текст (если нужен только текст)\n\n4. Для заполнения форм:\n   browser_shipping_fill(все_параметры_сразу)\
  \ — адрес + доставка\n   browser_payment_fill(все_параметры_сразу) — карта + Terms\
  \ автоматом\n\n5. ЭТО ЭКОНОМИТ ТОКЕНЫ: \n   - snapshot = 1 скриншот + 1 LLM-вызов\
  \ на распознавание\n   - read_dom = 1 JS eval (без LLM, без картинок)\n   - bulk\
  \ fill = 1 LLM-раунд вместо 6\n\n6. Пример цикла для shopping:\n   a) browser_read_dom()\
  \ — понять what's on the page\n   b) browser_click_eval(...) — найти и кликнуть\
  \ по data-testid\n   c) browser_shipping_fill(...) — адрес за 1 раз\n   d) browser_payment_fill(...)\
  \ — карта за 1 раз\n   e) Готово. Ни одного snapshot, ни одного координатного клика."
